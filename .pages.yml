media:
  input: media/
  output: /media/

content:
  - name: video_database
    label: Performance Archive
    type: file             # Forces Pages CMS to read/write ONE central database file
    path: public/data/videos.json # Change to 'src/data/videos.json' if using Vite/Next.js source paths
    format: json

    fields:
      - name: videos
        label: Performance Sessions List
        type: list         # Creates an expandable, drag-and-drop table list
        shrink: true
        fields:
          - name: session_number
            label: Session Number
            type: number
            required: true

          - name: total_sessions
            label: Total Sessions
            type: number
            required: true

          - name: date
            label: Session Date
            type: date
            required: true

          - name: video_url
            label: YouTube Video URL
            type: string
            required: true
