media:
  input: media/
  output: /media/

content:
  - name: video_records_v4   # Changed to instantly clear any lingering layout cache
    label: Performance Archive
    type: collection
    path: _videos/
    format: json
    slug: "session-{{session_number}}.json" # This tells the modern system to save as a JSON file

    fields:
      - name: session_number
        label: Session Number
        type: number
        required: true

      - name: total_sessions
        label: Total Sessions
        type: number
        required: true

      - name: date
        label: Session Date
        type: date
        required: true

      - name: video_url
        label: YouTube Video URL
        type: string
        required: true
