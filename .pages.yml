# Define where media assets are saved inside your repo
media:
  input: media/
  output: /media/

# Define the Performance Archive Collection
content:
  - name: performances
    label: Performance Archive
    type: collection
    path: _performances/
    extension: md
    format: front-matter # CRITICAL: This tells Pages CMS to look between the --- lines
    slug: "session-{{session_number}}"

    # Fields MUST perfectly match the keys used inside your markdown files
    fields:
      - name: session_number
        label: Session Number
        type: number
        required: true

      - name: total_sessions
        label: Total Sessions
        type: number
        required: true

      - name: date
        label: Session Date
        type: date
        required: true

      - name: video_url
        label: Video URL / Link
        type: string
        required: true
