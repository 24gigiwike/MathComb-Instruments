media:
  input: media/
  output: /media/

content:
  - name: videos           # Changed name to reset browser cache completely
    label: Performance Archive
    type: collection       # Uses clean collection format instead of single file
    path: public/data/videos/ # Folder where individual json files go
    extension: json
    format: json
    slug: "session-{{session_number}}"

    fields:
      - name: session_number
        label: Session Number
        type: number
        required: true

      - name: total_sessions
        label: Total Sessions
        type: number
        required: true

      - name: date
        label: Session Date
        type: date
        required: true

      - name: video_url
        label: YouTube Video URL
        type: string
        required: true
