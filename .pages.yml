media:
  input: media/
  output: /media/

content:
  - name: video_database
    label: Performance Archive
    type: file
    path: src/data/videos.json
    format: json

    fields:
      - name: videos
        label: Performance Sessions List
        type: list              # Creates the list container
        fields:                 # Indented exactly two spaces deeper than name
          - name: session_number
            label: Session Number
            type: number
            required: true

          - name: total_sessions
            label: Total Sessions
            type: number
            required: true

          - name: date
            label: Session Date
            type: date
            required: true

          - name: video_url
            label: YouTube Video URL
            type: string
            required: true
