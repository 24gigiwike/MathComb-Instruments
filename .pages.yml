media:
  input: media/
  output: /media/

content:
  - name: video_posts        # Fresh name to completely force-clear the CMS cache
    label: Performance Archive
    type: collection
    path: _videos/           # Folder sits right at the root of your repo
    extension: json
    format: json
    slug: "session-{{session_number}}"

    fields:
      - name: session_number
        label: Session Number
        type: number
        required: true

      - name: total_sessions
        label: Total Sessions
        type: number
        required: true

      - name: date
        label: Session Date
        type: date
        required: true

      - name: video_url
        label: YouTube Video URL
        type: string
        required: true
